# Netlify site configuration.
#
# A static Vite bundle and nothing else. The API is a separate deployment
# (naxits-api), so no credential belongs in this build - not even the manage
# password, which is typed into the lock screen and forwarded to the API.
#
# VITE_API_BASE_URL must be set in the build environment: it is baked into the
# bundle at build time, and an empty value makes every API call fall through to
# the SPA redirect below and come back as HTML.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "npm run dev"
  # vite.config.ts pins 8082; without this the CLI waits on Vite's default 5173.
  targetPort = 8082
  port = 8891
  autoLaunch = false

# Client-side routing: /projects/:id has no file behind it, so a direct load or
# refresh must still be served index.html.
#
# There are no functions on this site, so note what this means for /api/*: a
# relative API call would match here and be answered with index.html rather than
# a 404. That is the signature of a missing VITE_API_BASE_URL.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # A private personal tool. Nothing here should ever need a camera, a
    # microphone or a location, and no page should be able to frame it.
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Robots-Tag = "noindex, nofollow"
